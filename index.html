<!DOCTYPE html>
<html lang="en"><head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: flex-end; /* Håller bilden till höger */
    }

    .hero-image {
      height: 100vh;
      object-fit: cover;
      display: block;
      border: none;
    }

    .overlay-text {
      position: absolute;
      left: 10vw; /* 10% från den vänstra kanten */
      top: 50%;
      transform: translateY(-50%); /* Centrerar texten vertikalt */
      color: black;
      font-family: sans-serif;
      text-align: left; /* Vänsterställer texten */
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <img src="img/bjorn.png" alt="img" class="hero-image">
    <div class="overlay-text">
      <h1 style="margin: 0 0 10px 0; font-size: 2.5rem;">Din Rubrik Här</h1>
    </div>
  </div>
</body></html>
